[package]
name = "tak_viewer"
description = "Motive-style viewer and marker editor for OptiTrack TAK data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tak_core = { path = "../tak_core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
egui_dock = { version = "0.14", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
ab_glyph = "0.2"
libc = "0.2"

# WSL/Linux builds (tests) need a windowing backend feature.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["x11"] }

[[bin]]
name = "tak_viewer"
path = "src/main.rs"

# Tests only: read/write settings the way eframe stores them (RON).
[dev-dependencies]
tak_core = { path = "../tak_core", features = ["test-support"] }
ron = "0.8"
sha2 = "0.10"
